# Foot Terminal Configuration — KISS / Suckless Nord & Dracula Rice

[main]
font=JetBrains Mono:size=10.5
pad=6x6 center
dpi-aware=no

# Active initial theme (managed by ~/.local/bin/theme-switch)
include=~/.config/foot/theme.ini

[bell]
urgent=no
notify=no
visual=no

[scrollback]
lines=5000

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

# Authentic Nord palette (SIGUSR1 / initial-color-theme=dark)
[colors-dark]
alpha=0.90
foreground=D8DEE9
background=2E3440
cursor=2E3440 D8DEE9
selection-foreground=2E3440
selection-background=88C0D0
urls=88C0D0
regular0=3B4252
