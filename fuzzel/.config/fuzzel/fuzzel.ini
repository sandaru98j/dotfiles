# Fuzzel Configuration — Fast Keyboard-First Launcher (KISS / Suckless)
# Colors are managed dynamically by ~/.local/bin/theme-switch

include=~/.config/fuzzel/theme.ini

[main]
font=JetBrains Mono:size=11
dpi-aware=no
prompt="❯ "
icons-enabled=no
fields=filename,name,generic
terminal=footclient
layer=overlay
lines=10
width=40
horizontal-pad=16
vertical-pad=12
inner-pad=6
line-height=22
letter-spacing=0

[border]
width=2
radius=0
