# Hyprlock Configuration — Minimal Nord / Dracula (synced via theme-switch)

source = ~/.config/hypr/hyprlock-theme.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = true
    no_fade_out = true
}

background {
    monitor =
    color = $bg
}

label {
    monitor =
    text = $TIME
    color = $fg_bright
    font_size = 64
    font_family = JetBrains Mono
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date "+%A, %d %B"
    color = $muted
    font_size = 16
    font_family = JetBrains Mono
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 42
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $fg_bright
    fade_on_empty = false
    placeholder_text = <span foreground="##88c0d0">Password</span>
    hide_input = false
    rounding = 0
    check_color = $yellow
    fail_color = $red
    fail_text = <i>Authentication failed</i>
    position = 0, -60
    halign = center
    valign = center
}
