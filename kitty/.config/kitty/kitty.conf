# Kitty Terminal Configuration — KISS / Suckless Nord & Dracula Rice

# Font
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5

# Window — flat, zero decorations, clean 6px padding, subtle transparency
window_padding_width 6
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
background_opacity 0.90
dynamic_background_opacity yes

# Audio & Visual Bell — disabled
enable_audio_bell no
visual_bell_duration 0.0

# Performance (Intel HD 620 friendly)
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Cursor & Scrollback
cursor_shape block
cursor_blink_interval 0
scrollback_lines 5000

# Tab bar (minimal, top, hidden unless >1 tab)
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled

# Dynamic theme (managed by ~/.local/bin/theme-switch)
include theme.conf
